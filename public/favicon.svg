<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The brand mark on a plate. Geometry is src/BrandMark.vue's, kept in step by
    hand: a standalone SVG can't read the --hb-* tokens, so the colours are the
    dark theme's literals (src/style.css). One palette, not a
    prefers-color-scheme switch: Safari doesn't honour that in a favicon, and
    the dark plate reads against light and dark browser chrome alike.
  -->
  <rect width="64" height="64" rx="14" fill="#181b22"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="#7d8494" stroke-width="4"/>
  <line x1="11" y1="10" x2="11" y2="54" stroke="#7d8494" stroke-width="6"/>
  <circle cx="30" cy="32" r="11" fill="#818cf8"/>
  <circle cx="50" cy="32" r="7.5" fill="#e3e6ee"/>
</svg>
